services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      OPENBOT_ALLOWLIST: ${OPENBOT_ALLOWLIST:-}
      OPENBOT_BASIC_AUTH_USER: ${OPENBOT_BASIC_AUTH_USER:-}
      OPENBOT_BASIC_AUTH_HASH: ${OPENBOT_BASIC_AUTH_HASH:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3 support
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - default
      - web
    depends_on:
      - web
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    build: .
    restart: unless-stopped
    expose:
      - "80"

volumes:
  caddy_data:
  caddy_config:

networks:
  web:
    external: true
