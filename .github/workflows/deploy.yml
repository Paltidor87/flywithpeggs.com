name: Deploy to Hostinger VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy flywithpeggs.com
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up SSH key
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER: ${{ secrets.SERVER_IP }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H $SERVER >> ~/.ssh/known_hosts

      - name: Deploy via rsync
        env:
          SERVER: ${{ secrets.SERVER_IP }}
        run: |
          rsync -avz --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.gitignore' \
            --exclude '.DS_Store' \
            --exclude 'node_modules' \
            --exclude '*.docx' \
            --exclude 'hostinger-setup.sh' \
            --exclude 'hetzner-setup.sh' \
            --exclude 'deploy.sh' \
            --exclude 'README.md' \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no" \
            ./ deploy@${SERVER}:/home/deploy/flywithpeggs.com/

      - name: Ensure shared Docker network exists
        env:
          SERVER: ${{ secrets.SERVER_IP }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no \
            deploy@${SERVER} \
            "docker network inspect web >/dev/null 2>&1 || docker network create web"

      - name: Build and restart containers
        env:
          SERVER: ${{ secrets.SERVER_IP }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no \
            deploy@${SERVER} \
            "cd /home/deploy/flywithpeggs.com && docker compose up -d --build --remove-orphans"

      - name: Log deploy in Notion (Citadelle)
        env:
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
          NOTION_CITADELLE_PAGE_ID: ${{ secrets.NOTION_CITADELLE_PAGE_ID }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_BEFORE: ${{ github.event.before }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import urllib.request
          from datetime import datetime, timezone

          token = os.getenv("NOTION_API_TOKEN", "").strip()
          page_id = os.getenv("NOTION_CITADELLE_PAGE_ID", "").strip()
          if not token or not page_id:
              print("Skipping Notion deploy log (missing NOTION_API_TOKEN or NOTION_CITADELLE_PAGE_ID).")
              raise SystemExit(0)

          before = os.getenv("GITHUB_BEFORE", "").strip()
          after = os.getenv("GITHUB_SHA", "").strip()
          repo = os.getenv("GITHUB_REPOSITORY", "").strip()
          server = os.getenv("GITHUB_SERVER_URL", "https://github.com").strip()

          date_str = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")
          short_sha = after[:7] if after else "unknown"
          commit_url = f"{server}/{repo}/commit/{after}" if repo and after else ""

          files_changed = "unknown"
          extent = "Medium"
          diff_summary = ""

          if before and after and before != "0000000000000000000000000000000000000000":
              stat_proc = subprocess.run(
                  ["git", "diff", "--shortstat", before, after],
                  capture_output=True,
                  text=True,
                  check=False,
              )
              diff_summary = (stat_proc.stdout or "").strip()

              files_proc = subprocess.run(
                  ["git", "diff", "--name-only", before, after],
                  capture_output=True,
                  text=True,
                  check=False,
              )
              changed_files = [line.strip() for line in (files_proc.stdout or "").splitlines() if line.strip()]
              if changed_files:
                  files_changed = ", ".join(changed_files[:8])
                  if len(changed_files) > 8:
                      files_changed += f", +{len(changed_files) - 8} more"
                  count = len(changed_files)
                  if count <= 2:
                      extent = "Small"
                  elif count <= 8:
                      extent = "Medium"
                  else:
                      extent = "Large"
              else:
                  extent = "Small"
          else:
              diff_summary = "Initial push or unknown diff baseline."

          paragraph = f"Deploy Update — {date_str}"
          summary_line = f"Extent: {extent} | Diff: {diff_summary or 'n/a'}"
          files_line = f"Files: {files_changed}"
          commit_line = f"Commit: {short_sha} {commit_url}".strip()

          payload = {
              "children": [
                  {
                      "object": "block",
                      "type": "heading_3",
                      "heading_3": {
                          "rich_text": [{"type": "text", "text": {"content": paragraph}}]
                      },
                  },
                  {
                      "object": "block",
                      "type": "bulleted_list_item",
                      "bulleted_list_item": {
                          "rich_text": [{"type": "text", "text": {"content": summary_line}}]
                      },
                  },
                  {
                      "object": "block",
                      "type": "bulleted_list_item",
                      "bulleted_list_item": {
                          "rich_text": [{"type": "text", "text": {"content": files_line}}]
                      },
                  },
                  {
                      "object": "block",
                      "type": "bulleted_list_item",
                      "bulleted_list_item": {
                          "rich_text": [{"type": "text", "text": {"content": commit_line}}]
                      },
                  },
              ]
          }

          req = urllib.request.Request(
              url=f"https://api.notion.com/v1/blocks/{page_id}/children",
              data=json.dumps(payload).encode("utf-8"),
              method="PATCH",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
                  "Notion-Version": "2022-06-28",
              },
          )

          with urllib.request.urlopen(req, timeout=20) as resp:
              if resp.status < 200 or resp.status >= 300:
                  raise RuntimeError(f"Notion API status {resp.status}")
              print("Notion deploy log appended.")
          PY
